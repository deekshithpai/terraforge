services:
  postgis:
    image: postgis/postgis:18-3.6

    environment:
      POSTGRES_DB: terraforge
      POSTGRES_USER: LOCAL_DB_USER
      POSTGRES_PASSWORD: LOCAL_DB_PASSWORD

    
    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - pg_spatial_data:/var/lib/postgresql

  
    networks:
      - app-network

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "LOCAL_DB_USER", "-d", "terraforge"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:8.8

    ports: 
      - "127.0.0.1:6379:6379"

    networks:
      - app-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3


  
volumes:
  pg_spatial_data:

networks:
  app-network: